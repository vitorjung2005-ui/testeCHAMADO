<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MIT Service Desk — Produção</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Tema Adaptativo para o Operador */
    :root {
      --accent: #D85A30;
      --bg: #F8F9FA;
      --card-bg: #FFFFFF;
      --text-main: #1F2937;
      --text-sub: #6B7280;
      --border: #E5E7EB;
      --input-bg: #FFFFFF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --card-bg: #1F2937;
        --text-main: #F9FAFB;
        --text-sub: #9CA3AF;
        --border: #374151;
        --input-bg: #111827;
      }
    }

    body { background-color: var(--bg); color: var(--text-main); font-family: -apple-system, sans-serif; transition: background-color 0.3s; margin: 0; }
    
    /* Controle de Visão (SPA) */
    .view { display: none; }
    .view.active { display: block; }

    /* Estilos do Formulário do Operador */
    .op-container { max-width: 440px; margin: 40px auto; background: var(--card-bg); padding: 32px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    .op-input { width: 100%; padding: 16px; background: var(--input-bg); border: 2px solid var(--border); border-radius: 12px; color: var(--text-main); font-size: 16px; margin-top: 8px; outline: none; transition: 0.2s; }
    .op-input:focus { border-color: var(--accent); }
    .op-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-sub); }
    .op-btn { width: 100%; background: var(--accent); color: white; padding: 18px; border-radius: 12px; font-weight: 700; margin-top: 24px; cursor: pointer; border: none; }
    .op-btn:disabled { opacity: 0.5; }

    /* Estilos de Impressão (Admin) */
    @media print {
      .no-print { display: none !important; }
      body { background: white; color: black; }
      .qr-card { border: 1px solid #ccc; break-inside: avoid; }
    }
  </style>
</head>
<body>

<div id="view-operador" class="view p-4">
  <div class="op-container">
    <header class="text-center mb-8">
      <h1 class="text-2xl font-bold mb-1">MIT Service Desk</h1>
      <p class="text-sm" style="color: var(--text-sub)">Suporte técnico rápido Magna</p>
    </header>

    <div id="msg-ok" class="hidden bg-emerald-100 text-emerald-800 border border-emerald-300 p-4 rounded-xl text-center font-bold mb-6">✓ Chamado enviado!</div>

    <form id="form-chamado">
      <div class="mb-5">
        <label class="op-label">Linha / Localização</label>
        <select id="field-line" class="op-input" required>
          <option value="" disabled selected>Onde você está?</option>
        </select>
      </div>

      <div class="mb-5">
        <label class="op-label">Categoria</label>
        <select id="field-category" class="op-input" required>
          <option value="" disabled selected>Tipo de problema...</option>
          <option value="Problema no computador">Problema no computador</option>
          <option value="Mouse ou teclado">Periférico (Mouse/Teclado)</option>
          <option value="Problema na impressão">Problema na impressão</option>
          <option value="Erro ao acessar PC Factory">Erro ao acessar PC Factory</option>
          <option value="Problema com a televisão">Problema com a televisão</option>
          <option value="Dúvidas/Outro">Dúvidas/Outro</option>
        </select>
      </div>

      <div class="mb-5">
        <label class="op-label">Descrição (Opcional)</label>
        <textarea id="field-desc" class="op-input" style="min-height: 100px; resize: none;" placeholder="O que houve?"></textarea>
      </div>

      <div class="mb-5">
        <label class="op-label">Seu Nome (Opcional)</label>
        <input type="text" id="field-name" class="op-input" placeholder="Ex: Vitor">
      </div>

      <button type="submit" id="btn-enviar" class="op-btn">ENVIAR CHAMADO</button>
    </form>
  </div>
</div>

<div id="view-admin" class="view p-4 md:p-8 max-w-7xl mx-auto">
  <div class="no-print flex justify-between items-center bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 mb-8">
    <div>
      <h1 class="text-2xl font-bold">Etiquetas QR — Magna</h1>
      <p class="text-slate-500 text-sm">Imprima para fixar nas linhas de produção</p>
    </div>
    <button onclick="window.print()" class="bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-6 py-3 rounded-xl font-bold">🖨️ Imprimir</button>
  </div>

  <div id="qr-grid" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-4"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

  // 1. CONFIGURAÇÕES FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyAck5mx4L0dzkcihFchV7-Oqt4fXGVyxVo",
    authDomain: "magna-service-desk.firebaseapp.com",
    projectId: "magna-service-desk",
    storageBucket: "magna-service-desk.firebasestorage.app",
    messagingSenderId: "377327792574",
    appId: "1:377327792574:web:c9b8623342b71fe89289ef"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const LINHAS = ["5s", "BACK PANEL GAMMA", "BACK PANEL HB", "BACK PANEL NB", "BOTINHA LH-RH", "B-SUV VERDE LH", "B-SUV VERDE RH", "CAIXA DE RODAS GAMMA LH", "CAIXA DE RODAS GAMMA RH", "CAIXA DE RODAS HB LH", "CAIXA DE RODAS HB LH-RH", "CAIXA DE RODAS HB RH", "CAIXA DE RODAS NB LH", "CAIXA DE RODAS NB RH", "CAVALO MARINHO LH", "CAVALO MARINHO RH", "COPINHO", "CXRD MIG HB", "EMBALAGEM P&A", "EMBALAGEM PSA", "EMBUCHAMENTO", "FRONT PSA", "GUTTER HB_ROOF HEADER", "KICK PANEL HB / POCKET HB", "KICK PANEL NB / PACKET SHELF", "POCKET NB / BACK PANEL NB", "PW - SILL ROXO LH", "PW - SILL ROXO RH", "PW - SILL VERDE LH", "PW - SILL VERDE RH", "PW _ B-SUV ROXO LH", "PW _ B-SUV ROXO RH", "PW _ B-SUV VERDE LH", "PW _ B-SUV VERDE RH", "PW PLATE - ASA_DELTA LH", "PW PLATE - ASA_DELTA RH", "PW PLATE GEM LH", "PW PLATE GEM RH", "PW06 - RAIL GAMMA LH", "PW06 - RAIL GAMMA RH", "PW06 - SILL 5 - CAPACETE LH", "PW06 - SILL 5 - CAPACETE RH", "PW06 - TV ASSOALHO (TV 4400) LH", "PW06 - TV ASSOALHO (TV 4400) RH", "PW07 - GUTTER LH", "PW07 - GUTTER RH", "PW07 - PLATE (SABONETEIRA)", "PW07 - RAIL GAMMA LH", "PW07 - RAIL GAMMA RH", "PW07 - REAR LH (CADEIRINHA)", "PW07 - REAR RH (CADEIRINHA)", "RAIL GAMMA LH-RH", "RAIL GEM LH-RH", "REAR 2 OP.20 / 50", "REAR 2 OP.40 / 60 / 70", "REAR 2 RQPS - SOLDA", "REAR MY19 - OP 20/40/50/60/70", "REAR MY19 - OP 80/85/RETRABALHO", "REAR MY19 - OP 80/85/RETRABALHO/EV", "REAR MY19 - OP EV", "REAR PM7 -", "REAR PM7 - OP RETRABALHO/EV", "ROCKER ABB LH-RH", "TRAVESSA 4400", "TRAVESSA DO RADIADOR", "TRAVESSA SILL 5", "TRAVESSA SILL 5 PW 5"];

  // 2. ROTEAMENTO DE VISÃO
  const urlParams = new URLSearchParams(window.location.search);
  const view = urlParams.get('view') || 'operador';
  document.getElementById(`view-${view}`).classList.add('active');

  // ==========================================
  // LÓGICA DO OPERADOR
  // ==========================================
  if (view === 'operador') {
    const sel = document.getElementById('field-line');
    LINHAS.forEach(l => { sel.innerHTML += `<option value="${l}">${l}</option>`; });

    // Auto-selecionar linha pelo QR Code
    const linhaUrl = urlParams.get('linha');
    if (linhaUrl) sel.value = linhaUrl;

    document.getElementById('form-chamado').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-enviar');
      btn.disabled = true;
      btn.innerText = "Enviando...";

      // Monta o objeto com os dados para enviar ao Power Automate
      const payload = {
        linha: document.getElementById('field-line').value,
        categoria: document.getElementById('field-category').value,
        descricao: document.getElementById('field-desc').value.trim() || "Não informado",
        prioridade: "Normal", 
        nome: document.getElementById('field-name').value.trim() || "Não informado"
      };

      // URL de Gatilho do Power Automate
      const urlPowerAutomate = "https://defaultc760270cf3da4cfa973703808ef557.9f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/58b00928225f4900b9b1670e214d87e6/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=MjwkH6YfR8Y2H_AKglQTnsQDXhHbeAf_cpT6kxKNXKQ";

      try {
        // Envio para o Power Automate via requisição HTTP POST
        const respostaHTTP = await fetch(urlPowerAutomate, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        if (!respostaHTTP.ok) {
            throw new Error("Falha na comunicação com o sistema de chamados.");
        }

        // Salva os dados no Firebase simultaneamente
        await addDoc(collection(db, "chamados_fabrica"), { ...payload, status: "Aberto", dataCriacao: serverTimestamp() });
        
        document.getElementById('msg-ok').classList.remove('hidden');
        document.getElementById('form-chamado').reset();
        window.scrollTo(0, 0);
      } catch (err) { 
        alert("Erro: " + err.message); 
      }
      
      btn.disabled = false;
      btn.innerText = "ENVIAR CHAMADO";
      setTimeout(() => document.getElementById('msg-ok').classList.add('hidden'), 4000);
    };
  }

  // ==========================================
  // LÓGICA DO ADMIN (GERADOR QR)
  // ==========================================
  if (view === 'admin') {
    const grid = document.getElementById('qr-grid');
    const baseURL = window.location.href.split('?')[0];

    LINHAS.forEach((linha, i) => {
      const card = document.createElement('div');
      card.className = "qr-card bg-white dark:bg-slate-800 p-4 border border-slate-200 dark:border-slate-700 rounded-xl flex flex-col items-center shadow-sm";
      
      const qrDiv = document.createElement('div');
      qrDiv.id = `qr-${i}`;
      qrDiv.className = "mb-2 p-2 bg-white rounded"; 
      
      const title = document.createElement('p');
      title.className = "text-[9px] font-black uppercase text-center leading-tight mt-2 text-slate-600 dark:text-slate-300";
      title.innerText = linha;

      card.appendChild(qrDiv);
      card.appendChild(title);
      grid.appendChild(card);

      new QRCode(qrDiv, {
        text: `${baseURL}?linha=${encodeURIComponent(linha)}`,
        width: 100, height: 100,
        colorDark: "#000000", colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    });
  }
</script>
</body>
</html>
