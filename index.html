<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIT Service Desk — Produção</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  
  <style>
    /* Variáveis de Cor Dinâmicas */
    :root {
      --accent: #D85A30;
      --bg: #F8F9FA;
      --card-bg: #FFFFFF;
      --text-main: #1F2937;
      --text-sub: #6B7280;
      --border: #E5E7EB;
      --input-bg: #FFFFFF;
      --radius: 16px;
    }

    /* Ajustes Automáticos para Modo Escuro */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --card-bg: #1F2937;
        --text-main: #F9FAFB;
        --text-sub: #9CA3AF;
        --border: #374151;
        --input-bg: #111827;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      transition: background-color 0.3s ease;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 440px;
      padding: 32px;
      border-radius: var(--radius);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border);
    }

    header { text-align: center; margin-bottom: 28px; }
    h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 8px; }
    .sub { font-size: 14px; color: var(--text-sub); }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      color: var(--text-sub);
    }

    .field-group { margin-bottom: 20px; }

    select, textarea, input {
      width: 100%;
      padding: 14px 16px;
      background-color: var(--input-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    select:focus, textarea:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(216, 90, 48, 0.15);
    }

    textarea { min-height: 100px; resize: none; }

    .btn {
      width: 100%;
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s active, opacity 0.2s;
      margin-top: 10px;
    }

    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { background-color: var(--text-sub); cursor: not-allowed; opacity: 0.5; }

    .alert-success {
      display: none;
      background-color: #DEF7EC;
      color: #03543F;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
      margin-bottom: 20px;
      border: 1px solid #BCF0DA;
    }

    /* Estilização básica para o select no dark mode */
    option { background: var(--card-bg); color: var(--text-main); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>MIT Service Desk</h1>
    <p class="sub">Suporte técnico rápido Magna</p>
  </header>

  <div id="msg-ok" class="alert-success">✓ Chamado enviado com sucesso!</div>

  <form id="form-chamado">
    <div class="field-group">
      <label>Linha / Localização</label>
      <select id="field-line" required>
        <option value="" disabled selected>Onde você está?</option>
      </select>
    </div>

    <div class="field-group">
      <label>Categoria</label>
      <select id="field-category" required>
        <option value="" disabled selected>Tipo de problema...</option>
        <option value="Problema no computador">Problema no computador</option>
        <option value="Mouse ou teclado">Periférico (Mouse/Teclado)</option>
        <option value="Problema na impressão">Problema na impressão</option>
        <option value="Erro ao acessar PC Factory">Erro ao acessar PC Factory</option>
        <option value="Problema com a televisão">Problema com a televisão</option>
        <option value="Dúvidas/Outro">Dúvidas/Outro</option>
      </select>
    </div>

    <div class="field-group">
      <label>Descrição (Opcional)</label>
      <textarea id="field-desc" placeholder="Explique brevemente o que houve..."></textarea>
    </div>

    <div class="field-group">
      <label>Seu Nome (Opcional)</label>
      <input type="text" id="field-name" placeholder="Ex: Vitor Jung">
    </div>

    <button type="submit" id="btn-enviar" class="btn">ENVIAR CHAMADO</button>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAck5mx4L0dzkcihFchV7-Oqt4fXGVyxVo",
    authDomain: "magna-service-desk.firebaseapp.com",
    projectId: "magna-service-desk",
    storageBucket: "magna-service-desk.firebasestorage.app",
    messagingSenderId: "377327792574",
    appId: "1:377327792574:web:c9b8623342b71fe89289ef"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  emailjs.init("m3eKTfSB0VqQXTKNf");

  const LINHAS = ["5s", "BACK PANEL GAMMA", "BACK PANEL HB", "BACK PANEL NB", "BOTINHA LH-RH", "B-SUV VERDE LH", "B-SUV VERDE RH", "CAIXA DE RODAS GAMMA LH", "CAIXA DE RODAS GAMMA RH", "CAIXA DE RODAS HB LH", "CAIXA DE RODAS HB LH-RH", "CAIXA DE RODAS HB RH", "CAIXA DE RODAS NB LH", "CAIXA DE RODAS NB RH", "CAVALO MARINHO LH", "CAVALO MARINHO RH", "COPINHO", "CXRD MIG HB", "EMBALAGEM P&A", "EMBALAGEM PSA", "EMBUCHAMENTO", "FRONT PSA", "GUTTER HB_ROOF HEADER", "KICK PANEL HB / POCKET HB", "KICK PANEL NB / PACKET SHELF", "POCKET NB / BACK PANEL NB", "PW - SILL ROXO LH", "PW - SILL ROXO RH", "PW - SILL VERDE LH", "PW - SILL VERDE RH", "PW _ B-SUV ROXO LH", "PW _ B-SUV ROXO RH", "PW _ B-SUV VERDE LH", "PW _ B-SUV VERDE RH", "PW PLATE - ASA_DELTA LH", "PW PLATE - ASA_DELTA RH", "PW PLATE GEM LH", "PW PLATE GEM RH", "PW06 - RAIL GAMMA LH", "PW06 - RAIL GAMMA RH", "PW06 - SILL 5 - CAPACETE LH", "PW06 - SILL 5 - CAPACETE RH", "PW06 - TV ASSOALHO (TV 4400) LH", "PW06 - TV ASSOALHO (TV 4400) RH", "PW07 - GUTTER LH", "PW07 - GUTTER RH", "PW07 - PLATE (SABONETEIRA)", "PW07 - RAIL GAMMA LH", "PW07 - RAIL GAMMA RH", "PW07 - REAR LH (CADEIRINHA)", "PW07 - REAR RH (CADEIRINHA)", "RAIL GAMMA LH-RH", "RAIL GEM LH-RH", "REAR 2 OP.20 / 50", "REAR 2 OP.40 / 60 / 70", "REAR 2 RQPS - SOLDA", "REAR MY19 - OP 20/40/50/60/70", "REAR MY19 - OP 80/85/RETRABALHO", "REAR MY19 - OP 80/85/RETRABALHO/EV", "REAR MY19 - OP EV", "REAR PM7 -", "REAR PM7 - OP RETRABALHO/EV", "ROCKER ABB LH-RH", "TRAVESSA 4400", "TRAVESSA DO RADIADOR", "TRAVESSA SILL 5", "TRAVESSA SILL 5 PW 5"];
  
  const sel = document.getElementById('field-line');
  LINHAS.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l; opt.textContent = l; sel.appendChild(opt);
  });

  document.getElementById('form-chamado').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-enviar');
    btn.disabled = true;
    btn.innerText = "Enviando...";

    // Tratamento de campos opcionais
    const descValue = document.getElementById('field-desc').value.trim() || "Não informado";
    const nameValue = document.getElementById('field-name').value.trim() || "Anônimo";

    const dados = {
      linha: document.getElementById('field-line').value,
      categoria: document.getElementById('field-category').value,
      descricao: descValue,
      operador: nameValue,
      to_email: 'vitorjung2005@hotmail.com',
      data_hora: new Date().toLocaleString('pt-BR')
    };

    try {
      // 1. Enviar EmailJS
      await emailjs.send("service_orzpcie", "template_nk1u6e5", dados);

      // 2. Salvar Firebase
      await addDoc(collection(db, "chamados_fabrica"), {
        linha: dados.linha,
        categoria: dados.categoria,
        descricao: dados.descricao,
        operador: dados.operador,
        status: "Aberto",
        prioridade: "Média",
        dataCriacao: serverTimestamp()
      });

      document.getElementById('msg-ok').style.display = 'block';
      document.getElementById('form-chamado').reset();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      alert("Falha no envio: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "ENVIAR CHAMADO";
      setTimeout(() => document.getElementById('msg-ok').style.display = 'none', 4000);
    }
  };
</script>
</body>
</html>
