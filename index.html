<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIT Service Desk — Operador</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  
  <style>
    :root { --accent: #D85A30; --bg: #ffffff; --bg-2: #f5f4f0; --text: #1a1a18; --border: rgba(0,0,0,0.12); --radius: 10px; }
    body { font-family: -apple-system, sans-serif; background: var(--bg-2); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .card { background: var(--bg); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 450px; border: 1px solid var(--border); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    h1 { font-size: 22px; margin-bottom: 8px; text-align: center; color: var(--text); }
    .sub { font-size: 13px; color: #666; text-align: center; margin-bottom: 20px; }
    label { display: block; font-size: 11px; font-weight: bold; margin: 12px 0 6px; text-transform: uppercase; color: #888; letter-spacing: 0.5px; }
    select, textarea, input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-size: 15px; background: #fafafa; transition: border-color 0.2s; }
    select:focus, textarea:focus, input:focus { border-color: var(--accent); outline: none; background: #fff; }
    textarea { min-height: 100px; resize: none; }
    .btn { width: 100%; background: var(--accent); color: white; border: none; padding: 16px; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 24px; cursor: pointer; transition: opacity 0.2s; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .success { display:none; background: #e6fffa; color: #2c7a7b; border: 1px solid #81e6d9; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="card">
  <h1>MIT Service Desk</h1>
  <p class="sub">Relate o problema para a equipe de TI</p>
  
  <div id="msg-ok" class="success">✔ Chamado enviado com sucesso!</div>
  
  <form id="form-chamado">
    <label>Linha / Localização</label>
    <select id="field-line" required>
      <option value="" disabled selected>Selecione a linha...</option>
    </select>

    <label>Categoria do Problema</label>
    <select id="field-category" required>
      <option value="" disabled selected>O que aconteceu?</option>
      <option value="Problema no computador">Problema no computador</option>
      <option value="Periférico defeituoso (Mause ou teclado)">Periférico defeituoso (Mouse/Teclado)</option>
      <option value="Problema na impressão">Problema na impressão</option>
      <option value="Erro ao acessar PC Factory">Erro ao acessar PC Factory</option>
      <option value="Problema com a televisão">Problema com a televisão</option>
      <option value="Dúvidas/Outro">Dúvidas/Outro</option>
    </select>

    <label>Descrição Detalhada</label>
    <textarea id="field-desc" required placeholder="Ex: Monitor piscando, teclado não digita..."></textarea>

    <label>Seu Nome</label>
    <input type="text" id="field-name" required placeholder="Digite seu nome">

    <button type="submit" id="btn-enviar" class="btn">ENVIAR CHAMADO</button>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

  // 1. CONFIGURAÇÕES
  const firebaseConfig = {
    apiKey: "AIzaSyAck5mx4L0dzkcihFchV7-Oqt4fXGVyxVo",
    authDomain: "magna-service-desk.firebaseapp.com",
    projectId: "magna-service-desk",
    storageBucket: "magna-service-desk.firebasestorage.app",
    messagingSenderId: "377327792574",
    appId: "1:377327792574:web:c9b8623342b71fe89289ef",
    measurementId: "G-YBLC6NTSL6"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  emailjs.init("m3eKTfSB0VqQXTKNf");

  // 2. LISTA COMPLETA DAS 67 LINHAS
  const LINHAS = ["5s", "BACK PANEL GAMMA", "BACK PANEL HB", "BACK PANEL NB", "BOTINHA LH-RH", "B-SUV VERDE LH", "B-SUV VERDE RH", "CAIXA DE RODAS GAMMA LH", "CAIXA DE RODAS GAMMA RH", "CAIXA DE RODAS HB LH", "CAIXA DE RODAS HB LH-RH", "CAIXA DE RODAS HB RH", "CAIXA DE RODAS NB LH", "CAIXA DE RODAS NB RH", "CAVALO MARINHO LH", "CAVALO MARINHO RH", "COPINHO", "CXRD MIG HB", "EMBALAGEM P&A", "EMBALAGEM PSA", "EMBUCHAMENTO", "FRONT PSA", "GUTTER HB_ROOF HEADER", "KICK PANEL HB / POCKET HB", "KICK PANEL NB / PACKET SHELF", "POCKET NB / BACK PANEL NB", "PW - SILL ROXO LH", "PW - SILL ROXO RH", "PW - SILL VERDE LH", "PW - SILL VERDE RH", "PW _ B-SUV ROXO LH", "PW _ B-SUV ROXO RH", "PW _ B-SUV VERDE LH", "PW _ B-SUV VERDE RH", "PW PLATE - ASA_DELTA LH", "PW PLATE - ASA_DELTA RH", "PW PLATE GEM LH", "PW PLATE GEM RH", "PW06 - RAIL GAMMA LH", "PW06 - RAIL GAMMA RH", "PW06 - SILL 5 - CAPACETE LH", "PW06 - SILL 5 - CAPACETE RH", "PW06 - TV ASSOALHO (TV 4400) LH", "PW06 - TV ASSOALHO (TV 4400) RH", "PW07 - GUTTER LH", "PW07 - GUTTER RH", "PW07 - PLATE (SABONETEIRA)", "PW07 - RAIL GAMMA LH", "PW07 - RAIL GAMMA RH", "PW07 - REAR LH (CADEIRINHA)", "PW07 - REAR RH (CADEIRINHA)", "RAIL GAMMA LH-RH", "RAIL GEM LH-RH", "REAR 2 OP.20 / 50", "REAR 2 OP.40 / 60 / 70", "REAR 2 RQPS - SOLDA", "REAR MY19 - OP 20/40/50/60/70", "REAR MY19 - OP 80/85/RETRABALHO", "REAR MY19 - OP 80/85/RETRABALHO/EV", "REAR MY19 - OP EV", "REAR PM7 -", "REAR PM7 - OP RETRABALHO/EV", "ROCKER ABB LH-RH", "TRAVESSA 4400", "TRAVESSA DO RADIADOR", "TRAVESSA SILL 5", "TRAVESSA SILL 5 PW 5"];

  const sel = document.getElementById('field-line');
  LINHAS.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l;
    opt.textContent = l;
    sel.appendChild(opt);
  });

  // 3. EVENTO DE ENVIO
  document.getElementById('form-chamado').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-enviar');
    btn.disabled = true;
    btn.innerText = "Enviando Chamado...";

    const dados = {
      linha: document.getElementById('field-line').value,
      categoria: document.getElementById('field-category').value,
      descricao: document.getElementById('field-desc').value,
      operador: document.getElementById('field-name').value,
      data: new Date().toLocaleString('pt-BR')
    };

    try {
      // DISPARO 1: EMAILJS (Cópia oficial)
      await emailjs.send("service_orzpcie", "template_nk1u6e5", dados);

      // DISPARO 2: FIREBASE (Para apitar no painel)
      await addDoc(collection(db, "chamados_fabrica"), {
        ...dados,
        status: "Aberto",
        prioridade: "Média",
        dataCriacao: serverTimestamp()
      });

      // FEEDBACK DE SUCESSO
      document.getElementById('msg-ok').style.display = 'block';
      document.getElementById('form-chamado').reset();
      window.scrollTo(0,0);
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

    } catch (err) {
      alert("Erro ao enviar: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "ENVIAR CHAMADO";
      setTimeout(() => document.getElementById('msg-ok').style.display = 'none', 5000);
    }
  };
</script>
</body>
</html>
